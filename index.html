  const ou=[0.5,1.5,2.5,3.5,4.5].map(n=>({n,over:+(marc.filter(m=>m.g1+m.g2>n).reduce((a,b)=>a+b.p,0)/tot*100).toFixed(1),under:+(marc.filter(m=>m.g1+m.g2<=n).reduce((a,b)=>a+b.p,0)/tot*100).toFixed(1)}));
  const btts=marc.filter(m=>m.g1>0&&m.g2>0).reduce((a,b)=>a+b.p,0)/tot;
  const ov05h1=(1-Math.exp(-(l1*.45+l2*.45)))*100,ov15h1=(1-Math.exp(-(l1*.45+l2*.45))*(1+(l1*.45+l2*.45)))*100;
  const ov05h2=(1-Math.exp(-(l1*.55+l2*.55)))*100,ov15h2=(1-Math.exp(-(l1*.55+l2*.55))*(1+(l1*.55+l2*.55)))*100;
  const confBase=Math.min(82,Math.max(42,50+Math.abs(eloDiff)/22));
  const conf=Math.min(95,confBase+(bonus.noticias?5:0)+(bonus.apiReal?8:0)+(bonus.cuotas?5:0));
  return{
    p1:(p1/tot*100).toFixed(1),emp:(emp/tot*100).toFixed(1),p2:(p2/tot*100).toFixed(1),
    g1:g1e.toFixed(2),g2:g2e.toFixed(2),tot:(g1e+g2e).toFixed(2),
    g1lo:Math.max(0,g1e-1.28*sd1).toFixed(1),g1hi:(g1e+1.28*sd1).toFixed(1),
    g2lo:Math.max(0,g2e-1.28*sd2).toFixed(1),g2hi:(g2e+1.28*sd2).toFixed(1),
    marc:`${marc[0].g1}-${marc[0].g2}`,marcP:(marc[0].p/tot*100).toFixed(1),
    ou,btts:(btts*100).toFixed(1),
    ov05h1:ov05h1.toFixed(1),ov15h1:ov15h1.toFixed(1),ov05h2:ov05h2.toFixed(1),ov15h2:ov15h2.toFixed(1),
    pFG1:(l1/(l1+l2)*100).toFixed(1),pFG2:(l2/(l1+l2)*100).toFixed(1),
    minPG:Math.min(89,Math.round(90/(l1+l2))),
    p00:(marc.find(m=>m.g1===0&&m.g2===0)?.p/tot*100||0).toFixed(1),
    ah:(g1e-g2e).toFixed(2),conf:conf.toFixed(0),
    l1:l1.toFixed(3),l2:l2.toFixed(3),eloDiff,
    hasReal:!!(over1||over2),
  };
}

// Probabilidad conjunta con correlación real
function probConjunta(apuestas){
  if(!apuestas.length)return 100;
  const pp={};
  apuestas.forEach(ap=>{const k=ap.e1+"|"+ap.e2;if(!pp[k])pp[k]=[];pp[k].push(ap);});
  let total=1;
  for(const[key,aps]of Object.entries(pp)){
    const[eq1,eq2]=key.split("|");
    const r=calcular(eq1,eq2);
    const l1=parseFloat(r.l1),l2=parseFloat(r.l2);
    let suma=0,sumTot=0;
    for(let g1=0;g1<=8;g1++)for(let g2=0;g2<=8;g2++){
      const p=poisson(l1,g1)*poisson(l2,g2)*tau(g1,g2,l1,l2);
      sumTot+=p;
      const ok=aps.every(ap=>{switch(ap.tipo){case"1":return g1>g2;case"X":return g1===g2;case"2":return g1<g2;case"o05":return g1+g2>0.5;case"u05":return g1+g2<=0.5;case"o15":return g1+g2>1.5;case"u15":return g1+g2<=1.5;case"o25":return g1+g2>2.5;case"u25":return g1+g2<=2.5;case"o35":return g1+g2>3.5;case"u35":return g1+g2<=3.5;case"o45":return g1+g2>4.5;case"btts":return g1>0&&g2>0;case"nbtts":return!(g1>0&&g2>0);default:return true;}});
      if(ok)suma+=p;
    }
    total*=(sumTot>0?suma/sumTot:0);
  }
  return total*100;
}

    let parsed;try{parsed=JSON.parse(txt.replace(/```json|```/g,"").trim());}catch{parsed={bajas1:[],bajas2:[],factor1:1.0,factor2:1.0,resumen:"Sin noticias relevantes."};}
    currentNews=parsed;
    const f1=Math.max(0.7,Math.min(1.0,parseFloat(parsed.factor1)||1.0));
    const f2=Math.max(0.7,Math.min(1.0,parseFloat(parsed.factor2)||1.0));
    if(f1!==1.0||f2!==1.0){
      const s1adj={...BASE[eq1],xG:+(BASE[eq1].xG*f1).toFixed(2),forma:+(BASE[eq1].forma*(0.9+f1*0.1)).toFixed(2)};
      const s2adj={...BASE[eq2],xG:+(BASE[eq2].xG*f2).toFixed(2),forma:+(BASE[eq2].forma*(0.9+f2*0.1)).toFixed(2)};
      currentAdj=calcular(eq1,eq2,s1adj,s2adj,{noticias:true});

    const bajas=[...(parsed.bajas1||[]).map(b=>`${fl(eq1)} ${b}`),...(parsed.bajas2||[]).map(b=>`${fl(eq2)} ${b}`)];
    let html=`<div style="background:rgba(0,180,100,.06);border:1px solid rgba(0,180,100,.2);border-radius:8px;padding:8px 12px;margin-bottom:10px" class="fade">`;
    html+=`<div style="font-size:8px;letter-spacing:2px;color:${C.green};margin-bottom:5px;font-family:'Barlow',sans-serif">🔍 NOTICIAS · ${currentAdj?"⚠️ MODELO AJUSTADO":"SIN BAJAS RELEVANTES"}</div>`;

}

  document.getElementById("ai-loading").style.display="block";
  document.getElementById("ai-loading").textContent="Procesando modelo + noticias...";
  document.getElementById("ai-box").style.display="none";
  const r=currentAdj||currentRes;
  const e1=currentE1,e2=currentE2;
  const b1=BASE[e1]||{},b2=BASE[e2]||{};
  const bajas=[...(currentNews?.bajas1||[]).map(b=>`${e1}: ${b}`),...(currentNews?.bajas2||[]).map(b=>`${e2}: ${b}`)];
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:600,system:"Analista fútbol Mundial 2026. Español conciso, sin asteriscos.",messages:[{role:"user",content:`${fl(e1)} ${e1} vs ${fl(e2)} ${e2} · Mundial 2026\nELO ${b1.elo}vs${b2.elo} · xG ${b1.xG}vs${b2.xG} · λ ${r.l1}vs${r.l2}\n${bajas.length?"Bajas: "+bajas.join(", "):""}\n1X2: ${r.p1}/${r.emp}/${r.p2}% · Goles: ${r.g1}-${r.g2} · ${r.marc}(${r.marcP}%)\nO/U 2.5: ${r.ou[2].over}% · BTTS: ${r.btts}%\n1)Táctica+bajas(2 líneas) 2)Factores clave(2 líneas) 3)Predicción final(1 línea)`}]})});
    const d=await resp.json();
    const txt=d.content?.find(b=>b.type==="text")?.text||"Sin respuesta.";
    document.getElementById("ai-box").innerHTML=`<div style="background:rgba(21,101,192,.1);border:1px solid rgba(21,101,192,.3);border-radius:8px;padding:12px" class="fade"><div style="font-size:8px;letter-spacing:2px;color:${C.blue};margin-bottom:8px;font-family:'Barlow',sans-serif">🤖 ANÁLISIS · CLAUDE</div><div style="font-size:11px;line-height:1.7;font-family:'Barlow',sans-serif;color:#c4d9f0;white-space:pre-line">${txt}</div></div>`;
    document.getElementById("ai-box").style.display="block";
  }catch{document.getElementById("ai-box").innerHTML=`<div style="color:${C.red};font-family:'Barlow',sans-serif;font-size:11px">Error de conexión.</div>`;document.getElementById("ai-box").style.display="block";}
  document.getElementById("ai-loading").style.display="none";
  document.getElementById("btn-ai").style.display="block";
}

function renderGrupoBtns(){
  const c=document.getElementById("grupo-btns");
  Object.keys(GRUPOS).forEach(g=>{
    const btn=document.createElement("button");
    btn.id="gbtn-"+g;btn.textContent="G "+g;btn.onclick=()=>setGrupo(g);
    btn.style.cssText=`padding:6px 12px;border-radius:6px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #1a3a5c;background:rgba(255,255,255,.02);color:#5a8ab0;`;
    c.appendChild(btn);
  });
}
function setGrupo(g){
  grupoSel=g;
  Object.keys(GRUPOS).forEach(k=>{
    const btn=document.getElementById("gbtn-"+k);if(!btn)return;
    btn.style.background=k===g?"rgba(79,195,247,.1)":"rgba(255,255,255,.02)";
    btn.style.color=k===g?C.blue:"#5a8ab0";
    btn.style.borderColor=k===g?C.blue:"#1a3a5c";
  });
  const eqs=GRUPOS[g]||[];
  document.getElementById("grupo-equipos").innerHTML=eqs.map(eq=>`<div style="background:rgba(255,255,255,.03);border:1px solid #1a3a5c;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px"><span style="font-size:18px">${fl(eq)}</span><div><div style="font-size:11px;font-weight:600">${eq}</div><div style="font-size:8px;color:#5a8ab0;font-family:'Barlow',sans-serif">#${BASE[eq]?.rank} · ELO ${BASE[eq]?.elo}</div></div></div>`).join("");
  let html="";
  for(let i=0;i<eqs.length;i++)for(let j=i+1;j<eqs.length;j++){
    const e1=eqs[i],e2=eqs[j],r=calcular(e1,e2);
    html+=`<div class="partido"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="display:flex;align-items:center;gap:5px"><span style="font-size:16px">${fl(e1)}</span><div><div style="font-size:11px;font-weight:600">${e1}</div><div style="font-size:8px;color:${C.yellow};font-family:'Barlow',sans-serif">xG ${BASE[e1].xG}</div></div></div><div style="text-align:center"><div style="font-size:14px;font-weight:700;color:${C.green};letter-spacing:2px">${r.marc}</div><div style="font-size:8px;color:#5a8ab0;font-family:'Barlow',sans-serif">${r.marcP}%</div></div><div style="display:flex;align-items:center;gap:5px;text-align:right"><div><div style="font-size:11px;font-weight:600">${e2}</div><div style="font-size:8px;color:${C.yellow};font-family:'Barlow',sans-serif">xG ${BASE[e2].xG}</div></div><span style="font-size:16px">${fl(e2)}</span></div></div><div style="display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px"><div style="width:${r.p1}%;background:${C.blue}"></div><div style="width:${r.emp}%;background:${C.yellow}"></div><div style="width:${r.p2}%;background:${C.red}"></div></div><div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;font-family:'Barlow',sans-serif"><span style="color:${C.blue};font-weight:600">${r.p1}%</span><span style="color:${C.yellow}">X ${r.emp}%</span><span style="color:${C.red};font-weight:600">${r.p2}%</span></div></div>`;
  }
  document.getElementById("grupo-partidos").innerHTML=html;
}

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
function onComboE1Change(){
  const e1=document.getElementById("combo-e1").value;
  const sel2=document.getElementById("combo-e2");
  sel2.innerHTML="";
  if(!e1){sel2.disabled=true;sel2.innerHTML='<option value="">— Rival —</option>';document.getElementById("combo-opciones").innerHTML="";return;}
  sel2.disabled=false;
  const rivales=getRivales(e1);
  rivales.forEach(eq=>{const o=document.createElement("option");o.value=eq;o.textContent=eq;sel2.appendChild(o);});
  sel2.value=rivales[0]||"";
  renderComboOpciones();
}
function renderComboOpciones(){
  const e1=document.getElementById("combo-e1").value;
  const e2=document.getElementById("combo-e2").value;
  if(!e1||!e2||e1===e2){document.getElementById("combo-opciones").innerHTML="";return;}
  const r=calcular(e1,e2);
  const ops=[
    {tipo:"1",label:`${fl(e1)} ${e1} gana`,prob:parseFloat(r.p1)},
    {tipo:"X",label:"Empate",prob:parseFloat(r.emp)},
    {tipo:"2",label:`${fl(e2)} ${e2} gana`,prob:parseFloat(r.p2)},
    {tipo:"o05",label:"Over 0.5",prob:parseFloat(r.ou[0].over)},
    {tipo:"u05",label:"Under 0.5",prob:parseFloat(r.ou[0].under)},
    {tipo:"o15",label:"Over 1.5",prob:parseFloat(r.ou[1].over)},
    {tipo:"u15",label:"Under 1.5",prob:parseFloat(r.ou[1].under)},
    {tipo:"o25",label:"Over 2.5",prob:parseFloat(r.ou[2].over)},
    {tipo:"u25",label:"Under 2.5",prob:parseFloat(r.ou[2].under)},
    {tipo:"o35",label:"Over 3.5",prob:parseFloat(r.ou[3].over)},
    {tipo:"o45",label:"Over 4.5",prob:parseFloat(r.ou[4].over)},
    {tipo:"btts",label:"Ambos anotan (Sí)",prob:parseFloat(r.btts)},
    {tipo:"nbtts",label:"Ambos anotan (No)",prob:100-parseFloat(r.btts)},
  ];
  document.getElementById("combo-opciones").innerHTML=ops.map(op=>{
    const ya=combinada.some(x=>x.e1===e1&&x.e2===e2&&x.tipo===op.tipo);
    const col=op.prob>=65?C.green:op.prob>=52?C.yellow:C.red;
    return`<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border-radius:7px;padding:7px 10px;margin-bottom:5px"><span style="font-size:10px;font-family:'Barlow',sans-serif;flex:1;color:#ddeeff">${op.label}</span><span style="font-size:12px;font-weight:700;color:${col};min-width:42px;text-align:right">${op.prob.toFixed(1)}%</span><button onclick="addCombo('${e1}','${e2}','${op.tipo}','${op.label.replace(/'/g,"\\'")}',${op.prob})" style="padding:4px 10px;border-radius:5px;background:${ya?"rgba(255,255,255,.06)":"rgba(79,195,247,.2)"};color:${ya?"#5a8ab0":C.blue};font-size:10px;font-family:'Oswald',sans-serif;cursor:${ya?"not-allowed":"pointer"};font-weight:600">${ya?"✓":"+"}</button></div>`;
  }).join("");
}
function addCombo(e1,e2,tipo,label,prob){
  if(combinada.some(x=>x.e1===e1&&x.e2===e2&&x.tipo===tipo))return;
  combinada.push({id:Date.now(),e1,e2,tipo,label,prob});
  renderComboOpciones();renderComboLista();
}
function removeCombo(id){combinada=combinada.filter(x=>x.id!==id);renderComboOpciones();renderComboLista();}
function renderComboLista(){
  if(!combinada.length){
    document.getElementById("combo-lista").innerHTML="";
    document.getElementById("combo-resultado").style.display="none";
    document.getElementById("btn-combo-ai").style.display="none";
    document.getElementById("combo-ai-box").style.display="none";
    return;
  }
  let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:8px;letter-spacing:3px;color:${C.yellow};font-family:'Barlow',sans-serif">COMBINADA (${combinada.length} apuestas)</div><button onclick="combinada=[];renderComboLista();" style="font-size:9px;color:${C.red};background:transparent;font-family:'Barlow',sans-serif;cursor:pointer">Limpiar</button></div>`;
  combinada.forEach((ap,i)=>{
    const col=ap.prob>=65?C.green:ap.prob>=52?C.yellow:C.red;
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;background:rgba(255,255,255,.03);border-radius:7px;padding:7px 10px"><span style="font-size:9px;color:#2a4a6a;min-width:16px">${i+1}</span><div style="flex:1"><div style="font-size:9px;color:#ddeeff;font-family:'Barlow',sans-serif">${ap.label}</div><div style="font-size:8px;color:#5a8ab0;font-family:'Barlow',sans-serif">${fl(ap.e1)} ${ap.e1} vs ${fl(ap.e2)} ${ap.e2}</div></div><span style="font-size:12px;font-weight:700;color:${col}">${ap.prob.toFixed(1)}%</span><button onclick="removeCombo(${ap.id})" style="font-size:14px;color:${C.red};background:transparent;cursor:pointer">×</button></div>`;
  });
  const pt=probConjunta(combinada);
  const col=pt>=50?C.green:pt>=25?C.yellow:C.red;
  const mismoPartido=combinada.some((a,i,arr)=>arr.findIndex(b=>b.e1===a.e1&&b.e2===a.e2)!==i);
  html+=`<div style="margin-top:12px;border-top:1px solid #1a3a5c;padding-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:9px;font-family:'Barlow',sans-serif;color:#5a8ab0">Probabilidad combinada</span><span style="font-size:22px;font-weight:700;color:${col}">${pt.toFixed(2)}%</span></div><div class="bar" style="margin-bottom:8px"><div class="bar-fill" style="width:${Math.min(100,pt)}%;background:${col};height:8px"></div></div><div style="font-size:9px;font-family:'Barlow',sans-serif;color:#5a8ab0;margin-bottom:4px">${pt>=60?"✅ Alta probabilidad":pt>=35?"👍 Probabilidad moderada":pt>=15?"⚠️ Riesgo alto":"❌ Riesgo muy alto"}</div><div style="font-size:8px;color:#2a4a6a;font-family:'Barlow',sans-serif">1 de cada ~${Math.round(100/Math.max(0.1,pt))} combinadas aciertan.${mismoPartido?` <span style="color:${C.blue}">Correlación real aplicada.</span>`:""}</div></div></div>`;
  document.getElementById("combo-lista").innerHTML=html;
  document.getElementById("btn-combo-ai").style.display=combinada.length>=2?"block":"none";
}
async function pedirComboAI(){
  document.getElementById("btn-combo-ai").style.display="none";
  document.getElementById("combo-ai-box").style.display="none";
  const pt=probConjunta(combinada);
  const resumen=combinada.map(ap=>`${ap.e1} vs ${ap.e2}: ${ap.label} (${ap.prob.toFixed(1)}%)`).join("\n");
  const mismoPartido=combinada.filter((a,i,arr)=>arr.findIndex(b=>b.e1===a.e1&&b.e2===a.e2)===i).length<combinada.length;
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:500,system:"Analista fútbol. Español conciso, sin asteriscos.",messages:[{role:"user",content:`Combinada Mundial 2026:\n${resumen}\nProb. conjunta: ${pt.toFixed(2)}%${mismoPartido?" (correlación real aplicada)":""}\n1)¿Conflictos lógicos? 2)¿Correlaciones positivas? 3)Valoración global 4)Recomendación en 1 línea`}]})});
    const d=await resp.json();
    const txt=d.content?.find(b=>b.type==="text")?.text||"Sin respuesta.";
    document.getElementById("combo-ai-box").innerHTML=`<div style="background:rgba(0,105,92,.1);border:1px solid rgba(0,105,92,.35);border-radius:8px;padding:12px;margin-top:8px" class="fade"><div style="font-size:8px;letter-spacing:2px;color:${C.green};margin-bottom:8px;font-family:'Barlow',sans-serif">🤖 ANÁLISIS COMBINADA · CLAUDE</div><div style="font-size:11px;line-height:1.7;font-family:'Barlow',sans-serif;color:#c4d9f0;white-space:pre-line">${txt}</div></div>`;
    document.getElementById("combo-ai-box").style.display="block";
  }catch{document.getElementById("combo-ai-box").innerHTML=`<div style="color:${C.red};font-family:'Barlow',sans-serif;font-size:11px;padding:8px">Error de conexión.</div>`;document.getElementById("combo-ai-box").style.display="block";}
  document.getElementById("btn-combo-ai").style.display="block";
}

// ═══════════════════════════════════════════════════
//  API-FOOTBALL VÍA PROXY NETLIFY
// ═══════════════════════════════════════════════════
async function apiFetch(path){
  const res=await fetch(`/.netlify/functions/api?path=${encodeURIComponent(path)}&key=${encodeURIComponent(apiKey)}`);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const d=await res.json();
  if(d.errors&&Object.keys(d.errors).length>0)throw new Error(Object.values(d.errors).join(", "));
  return d;
}
function setApiMsg(txt,color="#7bafd4"){const el=document.getElementById("api-msg");el.textContent=txt;el.style.color=color;}

const API_MAP={"Mexico":"México","Brazil":"Brasil","France":"Francia","England":"Inglaterra","Spain":"España","Germany":"Alemania","Portugal":"Portugal","Netherlands":"Países Bajos","Belgium":"Bélgica","Croatia":"Croacia","Norway":"Noruega","Switzerland":"Suiza","Uruguay":"Uruguay","Colombia":"Colombia","Morocco":"Marruecos","Japan":"Japón","Senegal":"Senegal","Austria":"Austria","Turkey":"Turquía","Sweden":"Suecia","Canada":"Canadá","United States":"Estados Unidos","Ecuador":"Ecuador","Australia":"Australia","South Korea":"Corea del Sur","Korea Republic":"Corea del Sur","Iran":"Irán","Scotland":"Escocia","Paraguay":"Paraguay","Egypt":"Egipto","Tunisia":"Túnez","Algeria":"Algeria","Saudi Arabia":"Arabia Saudí","Bosnia and Herzegovina":"Bosnia-Herzegovina","Czech Republic":"Chequia","Ivory Coast":"Costa de Marfil","Ghana":"Ghana","Panama":"Panamá","South Africa":"Sudáfrica","DR Congo":"Congo DR","Cape Verde":"Cabo Verde","Jordan":"Jordania","New Zealand":"Nueva Zelanda","Haiti":"Haití","Iraq":"Irak","Qatar":"Qatar","Uzbekistan":"Uzbekistán","Curacao":"Curazao","Argentina":"Argentina"};
const norm=n=>API_MAP[n]||n;

async function conectarAPI(){
  const key=document.getElementById("api-input").value.trim();
  if(!key)return;
  localStorage.setItem("wc2026_apikey",key);
  apiKey=key;
  const btn=document.getElementById("btn-connect");
  btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  setApiMsg("🔄 Verificando clave...");
  try{
    const status=await apiFetch("/status");
    const plan=status?.response?.subscription?.plan||"Free";
    const limit=status?.response?.requests?.limit_day||100;
    setApiMsg(`✓ Plan ${plan} · ${limit} req/día. Buscando Mundial 2026...`,"#7bafd4");
    const leagues=await apiFetch("/leagues?type=Cup&name=FIFA World Cup");
    const wc=leagues?.response?.find(r=>r.league?.name?.toLowerCase().includes("world cup")&&r.seasons?.some(s=>s.year===2026));
    let teamStats={};
    if(wc){
      const lid=wc.league.id;
      setApiMsg(`✓ Mundial 2026 encontrado (ID ${lid}). Cargando datos...`,"#7bafd4");
      try{
        const st=await apiFetch("/standings?league="+lid+"&season=2026");
        const groups=st?.response?.[0]?.league?.standings||[];
        for(const group of groups)for(const entry of group){
          const name=norm(entry.team?.name||"");const base=BASE[name];if(!base)continue;
          const gp=entry.all?.played||0;
          if(gp>0){const gf=entry.all?.goals?.for||0,ga=entry.all?.goals?.against||0;
            teamStats[name]={...base,xG:+(gf/gp).toFixed(2),def:+(ga/gp).toFixed(2)||base.def,forma:+(entry.points/(gp*3)).toFixed(2)};}
        }
      }catch(_){}
      try{
        const lv=await apiFetch("/fixtures?league="+lid+"&season=2026&live=all");
        const ls=document.getElementById("live-strip");
        ls.innerHTML=(lv?.response||[]).map(f=>`<div style="background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);border-radius:8px;padding:5px 11px;white-space:nowrap;font-size:11px;font-family:'Barlow',sans-serif;flex-shrink:0"><span style="color:#ff5252;font-size:8px;margin-right:5px">● EN VIVO</span>${fl(norm(f.teams?.home?.name||""))} <strong>${f.goals?.home??"-"}–${f.goals?.away??"-"}</strong> ${fl(norm(f.teams?.away?.name||""))}<span style="color:#7bafd4;margin-left:5px;font-size:9px">${f.fixture?.status?.elapsed||""}'</span></div>`).join("");
      }catch(_){}
    }
    apiData={stats:teamStats};
    const nt=Object.keys(teamStats).length;
    const hora=new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
    const fecha=new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"});
    if(nt>0){setApiMsg(`✅ ${nt} equipos con datos reales · ${fecha} ${hora}`,"#69f0ae");}
    else{setApiMsg(`✅ API conectada (${plan}) · ${fecha} ${hora} · datos reales desde el 11 de junio`,"#69f0ae");}
    document.getElementById("btn-connect").style.background="#00695c";
  }catch(err){
    const m=err.message||"";
    if(m.includes("401")||m.toLowerCase().includes("invalid")||m.toLowerCase().includes("token")){setApiMsg("❌ Clave no válida","#ff5252");}
    else if(m.includes("429")){setApiMsg("❌ Límite diario alcanzado","#ff5252");}
    else{setApiMsg("❌ Error: "+m,"#ff5252");}
  }
  btn.textContent=apiKey?"✓ RECARGAR":"CONECTAR";btn.disabled=false;
}
function olvidarKey(){
  localStorage.removeItem("wc2026_apikey");
  apiKey="";apiData=null;
  document.getElementById("api-input").value="";
  setApiMsg("🗑️ Clave borrada","#ff7043");
  document.getElementById("btn-connect").style.background="#1565c0";
  document.getElementById("btn-connect").textContent="CONECTAR";
}
</script>
